<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 页面目录</title>
<meta name="description" content="经确认可公开的 HTML 页面目录与归档。">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2a1f17;--ink-2:#5a4636;--line:#e2d6c2;--accent:#a4502a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:clamp(26px,5vw,34px);margin:0 0 8px}
.lead{color:var(--ink-2);margin:0 0 32px}
h2{font-size:15px;letter-spacing:.08em;color:var(--ink-2);margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
li a{color:var(--accent);font-weight:700;font-size:17px;text-decoration:none}
li a:hover,li a:focus-visible{text-decoration:underline}
.meta{display:block;font-size:13.5px;color:var(--ink-2);margin-top:4px}
footer{margin-top:40px;font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <h1>HTML 页面目录</h1>
  <p class="lead">这里归档经确认可公开的 HTML 页面。以后会陆续加入新页面。</p>

  <h2>已收录页面</h2>
  <ul>
    <li>
      <a href="papertrails-workflow/">拆解 Papertrails：@xikhar 的 AI 制作流程（学习页）</a>
      <span class="meta">2026-11-18 · 根据公开资料整理的学习页。</span>
    </li>
  </ul>

  <footer>页面中引用的第三方内容，版权归原作者所有。</footer>
</main>
</body>
</html>
